{{- range $index, $machineClass := .Values.machineClasses }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $machineClass.name }}
  namespace: {{ $.Release.Namespace }}
{{- if $machineClass.labels }}
  labels:
{{ toYaml $machineClass.labels | indent 4 }}
{{- end }}
type: Opaque
data:
  userData: {{ $machineClass.secret.userData | b64enc }}
---
apiVersion: machine.sapcloud.io/v1alpha1
kind: MachineClass
metadata:
  name: {{ $machineClass.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- if $machineClass.labels }}
{{ toYaml $machineClass.labels | indent 4 }}
    {{- end }}
    {{- if $machineClass.operatingSystem }}
{{ toYaml $machineClass.operatingSystem | indent 4 }}
    {{- end }}
{{- if $machineClass.nodeTemplate }}
nodeTemplate:
  architecture: {{ $machineClass.nodeTemplate.architecture | quote }}
  capacity:
{{ toYaml $machineClass.nodeTemplate.capacity | indent 4 }}
  instanceType: {{ $machineClass.nodeTemplate.instanceType | quote }}
  region: {{ $machineClass.nodeTemplate.region | quote }}
  zone: {{ $machineClass.nodeTemplate.zone | quote }}
{{- end }}
providerSpec:
  imageID: {{ $machineClass.imageID | quote }}
  instanceType: {{ $machineClass.instanceType | quote }}
  region: {{ $machineClass.region | quote }}
  zoneID: {{ $machineClass.zoneID | quote }}
  securityGroupID: {{ $machineClass.securityGroupID | quote }}
  vSwitchID: {{ $machineClass.vSwitchID | quote }}
  systemDisk:
    category: {{ $machineClass.systemDisk.category | quote }}
    size: {{ $machineClass.systemDisk.size }}
{{- if $machineClass.dataDisks }}
  dataDisks:
{{ toYaml $machineClass.dataDisks | indent 2 }}
{{- end }}
  instanceChargeType: {{ $machineClass.instanceChargeType | quote }}
  internetChargeType: {{ $machineClass.internetChargeType | quote }}
  internetMaxBandwidthIn: {{ $machineClass.internetMaxBandwidthIn }}
  spotStrategy: {{ $machineClass.spotStrategy | quote }}
  keyPairName: {{ $machineClass.keyPairName | quote }}
  tags:
{{ toYaml $machineClass.tags | indent 4 }}
secretRef:
  name: {{ $machineClass.name }}
  namespace: {{ $.Release.Namespace }}
credentialsSecretRef:
  name: {{ $machineClass.credentialsSecretRef.name }}
  namespace: {{ $machineClass.credentialsSecretRef.namespace }}
provider: "Alicloud"
{{- end }}
