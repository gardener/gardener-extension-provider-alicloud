apiVersion: v1
kind: Secret
metadata:
  name: csi-diskplugin-alicloud
  namespace: kube-system
data:
{{- if .Values.credential.useWorkloadIdentity }}
  oidcProviderARN: {{ .Values.credential.oidcProviderARN | b64enc }}
  roleARN: {{ .Values.credential.roleARN | b64enc }}
  token: {{ .Values.credential.token }}
{{- else }}
  credentialsFile: {{ index .Values.credential.credentialsFile }}
{{- end }}
type: Opaque
