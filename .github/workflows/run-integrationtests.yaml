name: Integration-Tests
description: |
  Runs Integrationtests using TestMachinery

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

jobs:
  integrationtest:
    permissions:
      id-token: write
      contents: read
    uses: gardener/cc-utils/.github/workflows/run-testmachinery-tests.yaml@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
    with:
      test-command: |
        ${testrunner_run} \
         --no-execution-group \
         --testrun-prefix tm-extension-alicloud- \
         --timeout=5400 \
         --testruns-chart-path=.ci/testruns/default \
         --set revision=$(git rev-parse @)

