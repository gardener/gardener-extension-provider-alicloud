name: Create Upgrade-Pull-Requests
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  upgrade-pullrequests:
    if: ${{ github.repository_owner == 'gardener' }}
    uses: gardener/cc-utils/.github/workflows/upgrade-dependencies.yaml@9a9c4f544c072143b4c95b8f32b935332c47389d # v1
    permissions:
      contents: read
      id-token: write
