name: Release
on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        options:
          - bump-minor
          - bump-patch


jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
    with:
      mode: release

  integrationtest:
    uses: ./.github/workflows/run-integrationtests.yaml
    permissions:
      contents: read
      id-token: write

  release-to-github-and-bump:
    uses: gardener/cc-utils/.github/workflows/release.yaml@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
    needs:
      - build
      - integrationtest
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      release-commit-target: branch
      next-version: ${{ inputs.next-version }}
      next-version-callback-action-path: .github/actions/prepare-release
      slack-channel-id: C9CEBQPGE # #sap-tech-gardener
